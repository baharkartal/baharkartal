<title>Pusula</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap">
<style>
/* Layout: one calm phone column (max 560px), bottom tab bar, floating quick-add; sheets slide up for detail. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#E9EDE8; --ink:#17201B; --muted:#5F6B65; --line:#DCE1DA;
  --accent:#2C5C4C; --accent-soft:#DCE8E1; --accent-ink:#FFFFFF;
  --good:#2F7D55; --warn:#A8601A; --danger:#B03D35; --danger-soft:#F6E1DE; --warn-soft:#F5E8D8;
  --a-ev:#B07A34; --a-okul:#4766A8; --a-ingilizce:#7E52A6; --a-spor:#2F7D55; --a-para:#9A7B12; --a-kisisel:#A84E6E;
  --shadow:0 1px 2px rgba(23,32,27,.06),0 8px 24px rgba(23,32,27,.06);
  --f-display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --f-text:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#161C19; --surface-2:#1F2824; --ink:#E6EBE8; --muted:#94A19B; --line:#29332F;
  --accent:#86C7AA; --accent-soft:#1F332B; --accent-ink:#0E1311;
  --good:#86C7AA; --warn:#E3A566; --danger:#EC8077; --danger-soft:#3A2220; --warn-soft:#3A2E1F;
  --a-ev:#DDAA66; --a-okul:#88A4E0; --a-ingilizce:#B993DB; --a-spor:#86C7AA; --a-para:#D8BC55; --a-kisisel:#E08AA9;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#161C19; --surface-2:#1F2824; --ink:#E6EBE8; --muted:#94A19B; --line:#29332F;
  --accent:#86C7AA; --accent-soft:#1F332B; --accent-ink:#0E1311;
  --good:#86C7AA; --warn:#E3A566; --danger:#EC8077; --danger-soft:#3A2220; --warn-soft:#3A2E1F;
  --a-ev:#DDAA66; --a-okul:#88A4E0; --a-ingilizce:#B993DB; --a-spor:#86C7AA; --a-para:#D8BC55; --a-kisisel:#E08AA9;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding-block:20px 150px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.15}
h2{font-size:19px}
h3{font-size:16px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px;font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.view{display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h .meta{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{overflow-wrap:anywhere}
.row.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.empty{padding:16px;color:var(--muted);font-size:14px;text-align:left}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:500;padding:4px 0;font-size:14px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);font-size:14px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}
.check{width:26px;height:26px;border-radius:50%;border:1.6px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0;transition:background .15s,border-color .15s}
.check svg{width:14px;height:14px;opacity:0;color:var(--accent-ink)}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on svg{opacity:1}
.check.sq{border-radius:8px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* hello */
.hello{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hello .ring{flex:none;position:relative;width:76px;height:76px}
.hello .ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.hello .ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;font-weight:500}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:7}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync .dot{background:var(--muted)}
.sync.ok .dot{background:var(--good)}
.sync.local .dot{background:var(--warn)}

/* routine */
.rgrid{display:grid;grid-template-columns:1fr;gap:12px}
.rhead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 4px}
.rhead h3{display:flex;align-items:center;gap:8px}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s ease}

/* habits */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px}
.hcard .top{display:flex;align-items:center;gap:12px}
.hcard .name{font-weight:600;overflow-wrap:anywhere}
.hcard .sub{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);background:none;border:0;padding:0}
.wd i{width:100%;max-width:34px;height:24px;border-radius:7px;background:var(--surface-2);display:block}
.wd.on i{background:var(--accent)}
.wd.off i{background:transparent;border:1px dashed var(--line)}
.wd.today span{color:var(--ink);font-weight:600}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--ink)}
.streak svg{width:14px;height:14px;color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:500}
.stat span{font-size:11px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-text)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--accent)}
.chart .b0{fill:var(--surface-2)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2}
.chart .ar{fill:var(--accent-soft)}
.chart .pt{fill:var(--accent)}
.chart .tg{stroke:var(--warn);stroke-dasharray:4 4;stroke-width:1.2}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;max-width:100%;border:0;border-radius:8px;background:var(--surface-2);font-size:12px;color:var(--muted);padding:0}
.cal button.on{background:var(--accent);color:var(--accent-ink)}
.cal button.na{background:transparent;color:var(--line)}
.cal button.today{outline:1.5px solid var(--ink);outline-offset:-1.5px}
.cal span.blank{aspect-ratio:1}

/* goals */
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.gcard .gt{font-family:var(--f-display);font-size:18px;font-weight:500;overflow-wrap:anywhere}
.gcard .gm{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}

/* health */
.water{display:flex;align-items:center;gap:12px}
.glasses{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.glasses i{width:16px;height:22px;border-radius:3px 3px 6px 6px;border:1.5px solid var(--line);display:block}
.glasses i.on{background:var(--a-okul);border-color:var(--a-okul)}
.ai{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ai .txt{white-space:pre-wrap;font-size:14px}
.ai .who{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.ai .who svg{width:14px;height:14px}

/* english */
.words{display:flex;flex-direction:column;gap:8px}
.word{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--surface);border-radius:12px}
.word b{font-family:var(--f-display);font-weight:500;font-size:17px}
.word .ex{font-size:13px;color:var(--muted);font-style:italic}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:15px;min-width:0}
textarea.inp{resize:vertical;min-height:90px}
.inline{display:flex;gap:8px}
.inline .inp{flex:1}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-size:13px}
.days button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.radios{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface);text-align:left}
.radio.on{border-color:var(--accent);background:var(--accent-soft)}
.radio .rd{width:18px;height:18px;border-radius:50%;border:1.6px solid var(--line);flex:none}
.radio.on .rd{border:5px solid var(--accent)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--muted);font-weight:500}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(20px,calc(50vw - 280px + 4px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.18);display:grid;place-items:center}
.fab svg{width:24px;height:24px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.42);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 4px}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;transform:translate(-50%,100%);bottom:24px;border-radius:22px;max-height:86%}.sheet.show{transform:translate(-50%,0)}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(152px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--bg);font-weight:600;text-decoration:underline;padding:0}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;font-size:14px;display:flex;gap:12px;align-items:flex-start}
.banner p{margin:0;flex:1}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app"></div>
<div class="fab-wrap"><button class="fab" id="fab" aria-label="Hızlı ekle" data-a="quick"></button></div>
<nav class="tabbar" aria-label="Bölümler"><div class="in" id="tabs"></div></nav>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
'use strict';
/* ---------- icons ---------- */
const I = {
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg>',
  habit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  goal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
  health:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>',
  notes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h3"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v8"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.6L19.5 9l-5.7 1.6L12 16l-1.8-5.4L4.5 9l5.7-1.4zM19 15l.9 2.4 2.4.9-2.4.9L19 21.6l-.9-2.4-2.4-.9 2.4-.9z"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/></svg>'
};
document.getElementById('fab').innerHTML = I.plus;

/* ---------- constants ---------- */
const AREAS = {
  ev:{n:'Ev'}, okul:{n:'Okul'}, ingilizce:{n:'İngilizce'}, spor:{n:'Spor & beslenme'}, para:{n:'Online gelir'}, kisisel:{n:'Kişisel'}
};
const areaDot = a => `<span class="dot" style="background:var(--a-${AREAS[a]?a:'kisisel'})"></span>`;
const DOW = ['Pz','Pt','Sa','Ça','Pe','Cu','Ct'];

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); return x; };
const today = () => { const n = new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
const tk = () => keyOf(today());
const daysBetween = (a,b) => Math.round((b - a) / 86400000);
const fmtDay = d => d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
const fmtLong = d => d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
const endOfWeek = d => addDays(d, (7 - d.getDay()) % 7); // next Sunday (or today if Sunday)
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));

/* ---------- state & persistence ---------- */
let S = defaults();
let mode = 'loading'; // loading | cloud | local
let db = null, userId = null, sample = null;
const dirty = new Set(), chains = {};
let saveTimer = null, loadedKeys = new Set();
const LS = 'pusula.v1';

function lsRead(){ try { const r = localStorage.getItem(LS); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function lsWrite(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} }

function touch(...keys){
  keys.forEach(k => dirty.add(k));
  lsWrite();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 600);
  render();
}
function flush(){
  if (mode !== 'cloud' || !db) return;
  const keys = [...dirty]; dirty.clear();
  keys.forEach(k => {
    const ref = db.collection('data/users/' + userId).doc(k);
    const body = {v: clone(S[k]), t: Date.now()};
    chains[k] = (chains[k] || Promise.resolve()).then(() => ref.set(body)).catch(e => {
      if (e && e.code === 'unavailable') return new Promise(r => setTimeout(r, 800 + Math.random()*800)).then(() => ref.set({v: clone(S[k]), t: Date.now()})).catch(()=>{});
      if (e && e.code === 'quota_exceeded') toast('Depolama dolu: eski notları silerek yer açabilirsin.');
    });
  });
}

async function boot(){
  const cached = lsRead();
  if (cached) S = Object.assign(defaults(), cached);
  render();
  let u = null;
  try { if (window.claude && window.claude.use) { [db, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } } catch(e){ db = null; }
  try { userId = u ? await u.id() : null; } catch(e){ userId = null; }
  if (window.claude && window.claude.use) { window.claude.use('sample').then(s => { sample = s; render(); }).catch(()=>{}); }
  if (!db || !userId){ mode = 'local'; render(); return; }
  mode = 'cloud';
  const col = db.collection('data/users/' + userId);
  let gotDefinitive = false;
  const timer = setTimeout(() => { if (!gotDefinitive) { syncNote = 'Veriler henüz alınamadı; bağlantı gelince eşitlenecek.'; render(); } }, 10000);
  col.onSnapshot(snap => {
    const present = new Set();
    snap.docs.forEach(d => {
      present.add(d.id);
      if (!KEYS.includes(d.id) || dirty.has(d.id) || d.metadata.hasPendingWrites) return;
      const val = d.data() && d.data().v;
      if (val !== undefined) S[d.id] = clone(val);
    });
    if (!snap.metadata.fromCache && !gotDefinitive){
      gotDefinitive = true; clearTimeout(timer); syncNote = '';
      // first visit on this account: save the starter plan (or what this device had)
      KEYS.forEach(k => { if (!present.has(k)) dirty.add(k); });
      if (dirty.size) flush();
    }
    lsWrite(); render();
  }, err => { clearTimeout(timer); syncNote = 'Eşitleme durdu; değişikliklerin bu cihazda tutuluyor.'; mode = (err && err.code === 'revoked') ? 'local' : mode; render(); });
}
let syncNote = '';

/* ---------- habit math ---------- */
const isSched = (h, d) => h.days.includes(d.getDay()) && keyOf(d) >= h.created;
const isDone = (h, k) => !!(h.log && h.log[k]);
function streak(h){
  let d = today(), s = 0;
  if (isSched(h,d) && !isDone(h,keyOf(d))) d = addDays(d,-1);
  const start = parseKey(h.created);
  for (let i = 0; i < 1500 && d >= start; i++, d = addDays(d,-1)){
    if (!h.days.includes(d.getDay())) continue;
    if (isDone(h,keyOf(d))) s++; else break;
  }
  return s;
}
function bestStreak(h){
  let best = 0, cur = 0;
  for (let d = parseKey(h.created), t = today(); d <= t; d = addDays(d,1)){
    if (!h.days.includes(d.getDay())) continue;
    if (isDone(h,keyOf(d))) { cur++; best = Math.max(best,cur); } else if (keyOf(d) !== tk()) cur = 0;
  }
  return best;
}
function rate(h, days){
  let s = 0, done = 0;
  for (let i = 0; i < days; i++){ const d = addDays(today(),-i); if (isSched(h,d)){ s++; if (isDone(h,keyOf(d))) done++; } }
  return s ? Math.round(done/s*100) : 0;
}
const totalDone = h => Object.keys(h.log||{}).length;
const daysText = h => h.days.length === 7 ? 'Her gün' : (h.days.join() === '1,2,3,4,5' ? 'Hafta içi' : [1,2,3,4,5,6,0].filter(x=>h.days.includes(x)).map(x=>DOW[x]).join(' '));

/* ---------- reminders ---------- */
function remInfo(r){
  const t = today();
  if (r.kind === 'someday') return {cls:'acc', txt:'Yapana kadar her gün', ord:3};
  const due = parseKey(r.date);
  const diff = daysBetween(t, due);
  if (diff < 0) return {cls:'danger', txt:`${-diff} gün gecikti`, ord:0};
  if (r.kind === 'week'){
    if (diff === 0) return {cls:'warn', txt:'Bu haftanın son günü', ord:1};
    return {cls:'warn', txt:`Hafta içinde · ${diff} gün kaldı`, ord:2};
  }
  if (diff === 0) return {cls:'warn', txt:'Bugün' + (r.time ? ' · ' + r.time : ''), ord:1};
  if (diff === 1) return {cls:'', txt:'Yarın' + (r.time ? ' · ' + r.time : ''), ord:2};
  return {cls:'', txt:`${fmtDay(due)} · ${diff} gün sonra`, ord:2 + diff/1000};
}
const pendingRems = () => S.reminders.filter(r => !r.done).map(r => ({r, i:remInfo(r)})).sort((a,b) => a.i.ord - b.i.ord);

async function ask(key, fn){
  if (!sample || aiBusy[key]) return;

  try { await fn(); }

    toast(c === 'rate_limited' ? 'Şu an çok istek var, biraz sonra tekrar dene.' : c === 'not_granted' ? 'Yapay zekâ izni verilmedi.' : 'Yanıt alınamadı, tekrar dener misin?');
    if (c === 'not_granted') sample = null;
  }
  finally { aiBusy[key] = false; render(); }
}

function weeklyChart(h){
  const W = 320, H = 130, L = 38, B = 20, T = 8, n = 12;
  const mon = mondayOf(today()), bw = (W - L - 4) / n;
  let bars = '', labels = '';
  for (let i = 0; i < n; i++){
    const ws = addDays(mon, -(n-1-i)*7); let s = 0, d = 0;
    for (let j = 0; j < 7; j++){ const x = addDays(ws,j); if (x > today()) break; if (isSched(h,x)){ s++; if (isDone(h,keyOf(x))) d++; } }
    const r = s ? d/s : 0, bh = (H - B - T) * r, x = L + i*bw + 3;
    if (s) bars += `<rect class="b0" x="${x}" y="${T}" width="${bw-6}" height="${H-B-T}" rx="4"/>`;
    if (s) bars += `<rect class="b" x="${x}" y="${H-B-bh}" width="${bw-6}" height="${Math.max(bh, r>0?3:0)}" rx="4"><title>${fmtDay(ws)} haftası: ${d}/${s}</title></rect>`;
    if (i % 3 === 0 || i === n-1) labels += `<text x="${x + (bw-6)/2}" y="${H-5}" text-anchor="middle">${i===n-1?'Bu hafta':ws.getDate()+'.'+(ws.getMonth()+1)}</text>`;
  }
  const grid = [0,.5,1].map(p => { const y = H - B - (H-B-T)*p; return `<line class="grid" x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${p*100}%</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Son 12 haftada haftalık tamamlama oranı">${grid}${bars}${labels}</svg>`;
}
function calendar(h){
  const t = today(), start = mondayOf(addDays(t,-34));
  let cells = DOW.slice(1).concat(DOW[0]).map(d => `<span class="h">${d}</span>`).join('');
  for (let d = start; d <= addDays(mondayOf(t),6); d = addDays(d,1)){
    const k = keyOf(d), fut = d > t, sch = isSched(h,d);
    if (fut){ cells += `<span class="blank"></span>`; continue; }
    cells += `<button class="${isDone(h,k)?'on':''} ${!sch&&!isDone(h,k)?'na':''} ${k===tk()?'today':''}" data-a="hToggle" data-id="${h.id}" data-k="${k}" aria-label="${fmtDay(d)}">${d.getDate()}</button>`;
  }
  return `<div class="cal">${cells}</div>`;
}

function weightChart(){
  const w = S.health.weights.slice(-20);
  if (w.length < 2) return `<p class="small muted" style="margin:0">${w.length ? `Son kayıt: ${w[0].kg} kg. Grafik için bir kayıt daha ekle.` : 'Kilonu ara ara kaydet, değişimi burada görürsün.'}</p>`;
  const W = 320, H = 120, L = 34, R = 8, T = 12, B = 18;
  const vals = w.map(x=>x.kg).concat(S.meta.targetKg ? [S.meta.targetKg] : []);
  let mn = Math.floor(Math.min(...vals) - 1), mx = Math.ceil(Math.max(...vals) + 1);
  const X = i => L + i * (W-L-R) / (w.length-1), Y = v => T + (mx - v) / (mx - mn) * (H-T-B);
  const pts = w.map((p,i) => `${X(i).toFixed(1)},${Y(p.kg).toFixed(1)}`).join(' ');
  const area = `${L},${H-B} ${pts} ${X(w.length-1).toFixed(1)},${H-B}`;
  const last = w[w.length-1];
  const tg = S.meta.targetKg ? `<line class="tg" x1="${L}" x2="${W-R}" y1="${Y(S.meta.targetKg)}" y2="${Y(S.meta.targetKg)}"/><text x="${W-R}" y="${Y(S.meta.targetKg)-4}" text-anchor="end">hedef ${S.meta.targetKg}</text>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilo grafiği">
    <line class="grid" x1="${L}" x2="${W-R}" y1="${Y(mx)}" y2="${Y(mx)}"/><line class="grid" x1="${L}" x2="${W-R}" y1="${Y(mn)}" y2="${Y(mn)}"/>
    <text x="${L-6}" y="${Y(mx)+3}" text-anchor="end">${mx}</text><text x="${L-6}" y="${Y(mn)+3}" text-anchor="end">${mn}</text>
    <polygon class="ar" points="${area}"/>${tg}<polyline class="ln" points="${pts}"/>
    <circle class="pt" cx="${X(w.length-1)}" cy="${Y(last.kg)}" r="4"/>
    <text x="${L}" y="${H-4}">${esc(fmtDay(parseKey(w[0].date)))}</text><text x="${W-R}" y="${H-4}" text-anchor="end">${esc(fmtDay(parseKey(last.date)))}</text>
  </svg>`;
}

}

function vNotes(){
  const seg = `<div class="seg" role="tablist">${[['not','Notlar'],['yap','Yapılacaklar'],['al','Alınacaklar']].map(([k,l]) => `<button class="${noteSeg===k?'on':''}" data-a="nSeg" data-id="${k}" role="tab" aria-selected="${noteSeg===k}">${l} <span class="muted tnum">${S.notes.filter(n=>n.list===k&&!n.done).length}</span></button>`).join('')}</div>`;
  const items = S.notes.filter(n => n.list === noteSeg);
  const ph = {not:'Aklına gelen bir şey…', yap:'Yapılacak bir iş…', al:'Almak istediğin bir şey…'}[noteSeg];
  let body;
  if (noteSeg === 'not'){
    const sorted = [...items].sort((a,b) => (b.pinned?1:0)-(a.pinned?1:0) || b.created - a.created);
    body = sorted.map(n => `<div class="card" style="display:flex;gap:10px;align-items:flex-start"><div class="grow" style="flex:1;min-width:0"><div class="t" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.text)}</div><div class="small muted" style="margin-top:6px">${esc(new Date(n.created).toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</div></div>
      <button class="iconbtn" data-a="nPin" data-id="${n.id}" aria-label="${n.pinned?'Sabitlemeyi kaldır':'Sabitle'}" style="${n.pinned?'color:var(--accent);background:var(--accent-soft)':''}">${I.pin}</button><button class="iconbtn" data-a="nDel" data-id="${n.id}" aria-label="Sil">${I.trash}</button></div>`).join('') || '<div class="card empty">Henüz not yok. Gün içinde aklına geleni hemen buraya yaz.</div>';
  } else {
    const open = items.filter(n=>!n.done), done = items.filter(n=>n.done);
    body = `<div class="list">${open.map(nRow).join('') || `<div class="empty">${noteSeg==='al'?'Alışveriş ve istek listen boş.':'Yapılacak iş yok.'}</div>`}</div>
      ${done.length ? `<div class="sec-h"><span class="small muted">Tamamlananlar (${done.length})</span><button class="linkbtn" data-a="nClear">Temizle</button></div><div class="list">${done.map(nRow).join('')}</div>` : ''}`;
  }
  return `<div><p class="eyebrow">Gün içinde aklına gelenler</p><h1>Notlar & listeler</h1></div>${seg}
  <form class="inline" data-form="note"><${noteSeg==='not'?'textarea rows="2"':'input'} class="inp" id="nText" placeholder="${ph}" autocomplete="off" ${noteSeg==='not'?'style="min-height:48px"':''}>${noteSeg==='not'?'</textarea>':''}<button class="btn" type="submit">Ekle</button></form>
  <div class="sec">${body}</div>`;
}
const nRow = n => `<div class="row ${n.done?'done':''}"><button class="check sq ${n.done?'on':''}" data-a="nToggle" data-id="${n.id}" aria-label="${esc(n.text)}">${I.ok}</button><span class="grow t">${esc(n.text)}</span><button class="iconbtn" data-a="nDel" data-id="${n.id}" aria-label="Sil">${I.trash}</button></div>`;

/* quick add */
let qType = 'rem', remKind = 'week';
function sQuick(){
  const types = [['rem','Hatırlatma'],['not','Not'],['yap','Yapılacak'],['al','Alınacak']];
  const remForm = `
    <div class="field"><span class="lbl">Ne zaman?</span><div class="radios">
      ${[['week','Bu hafta içinde bir gün','Pazar\'a kadar her gün hatırlatır'],['date','Belirli bir gün','O güne kadar geri sayım, gecikirse uyarır'],['someday','Tarih yok','Yapana kadar her gün listede durur']].map(([k,l,d]) => `<button type="button" class="radio ${remKind===k?'on':''}" data-a="remKind" data-id="${k}"><span class="rd"></span><span><div>${l}</div><div class="small muted">${d}</div></span></button>`).join('')}
    </div></div>
    ${remKind==='date' ? `<div class="inline"><div class="field" style="flex:1"><label for="rDate">Tarih</label><input class="inp" id="rDate" type="date" required value="${keyOf(addDays(today(),1))}"></div><div class="field" style="flex:1"><label for="rTime">Saat</label><input class="inp" id="rTime" type="time"></div></div>` : ''}`;
  return `<div class="sheet-h"><h2>Hızlı ekle</h2><button class="iconbtn" data-a="close" aria-label="Kapat">${I.x}</button></div>
  <div class="seg">${types.map(([k,l]) => `<button class="${qType===k?'on':''}" data-a="qType" data-id="${k}">${l}</button>`).join('')}</div>
  <form data-form="quick" style="display:flex;flex-direction:column;gap:14px">
    <div class="field"><label for="qText">${qType==='rem'?'Neyi hatırlatayım?':'Yaz'}</label>${qType==='not'?'<textarea class="inp" id="qText" required placeholder="Aklına gelen…"></textarea>':`<input class="inp" id="qText" required autocomplete="off" placeholder="${qType==='rem'?'ör. Kargoya uğra, faturayı öde':qType==='al'?'ör. Spor ayakkabı':'ör. Ödev raporunu bitir'}">`}</div>
    ${qType==='rem' ? remForm : ''}
    <button class="btn block" type="submit">Ekle</button>
  </form>`;
}
function sRoutine(which){
  const list = S.routines[which];
  return `<div class="sheet-h"><h2>${which==='morning'?'Sabah':'Akşam'} rutinini düzenle</h2><button class="iconbtn" data-a="close" aria-label="Kapat">${I.x}</button></div>
  <form data-form="routine" data-id="${which}" style="display:flex;flex-direction:column;gap:14px">
    <div class="field"><label for="rList">Her satıra bir madde yaz</label><textarea class="inp" id="rList" style="min-height:220px">${esc(list.map(i=>i.text).join('\n'))}</textarea></div>
    <button class="btn block" type="submit">Kaydet</button>
  </form>`;
}
function sSettings(){
  return `<div class="sheet-h"><h2>Ayarlar</h2><button class="iconbtn" data-a="close" aria-label="Kapat">${I.x}</button></div>
  <form data-form="settings" style="display:flex;flex-direction:column;gap:14px">
    <div class="field"><label for="sName">Adın</label><input class="inp" id="sName" value="${esc(S.meta.name)}"></div>
    <div class="field"><label for="sLevel">İngilizce seviyen</label><select class="inp" id="sLevel">${['A1','A2','B1','B2','C1'].map(l=>`<option ${S.meta.level===l?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="inline"><div class="field" style="flex:1"><label for="sWater">Su hedefi (bardak)</label><input class="inp" id="sWater" type="number" min="1" max="20" value="${S.meta.waterGoal}"></div>
    <div class="field" style="flex:1"><label for="sKg">Hedef kilo</label><input class="inp" id="sKg" type="number" step="0.1" value="${S.meta.targetKg??''}"></div></div>
    <button class="btn block" type="submit">Kaydet</button>
  </form>
  <div class="card small muted" style="display:flex;flex-direction:column;gap:6px">
    <div>${mode==='cloud' ? 'Verilerin Claude hesabında, yalnızca sana özel olarak saklanıyor. Telefonda ve bilgisayarda aynı bağlantıyı açtığında her şey eşitlenir.' : 'Veriler şu an yalnızca bu cihazda saklanıyor. Eşitleme için uygulamayı Claude hesabınla açman gerekiyor.'}</div>
    <div>Hatırlatmalar uygulamayı her açtığında "Bugün" sayfasının en üstünde görünür ve sen tamamlayana kadar orada kalır.</div>
  </div>`;
}

/* sheets */
function openSheet(kind, id){ sheet = {kind, id}; confirmKey = null; renderSheet(true); }
function renderSheet(first){
  const root = document.getElementById('sheetRoot');
  const fns = {habit:sHabit, habitForm:sHabitForm, goal:sGoal, goalForm:sGoalForm, quick:sQuick, routine:sRoutine, settings:sSettings};
  const html = fns[sheet.kind](sheet.id);
  if (!sheet) return;
  if (first || !root.firstChild){
    root.innerHTML = `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="in"><div class="grab"></div><div id="sheetBody" style="display:flex;flex-direction:column;gap:16px">${html}</div></div></div>`;
    requestAnimationFrame(() => { root.querySelector('.scrim').classList.add('show'); root.querySelector('.sheet').classList.add('show'); const f = root.querySelector('input:not([type=date]):not([type=time]),textarea'); if (f && first && ['quick','habitForm','goalForm'].includes(sheet.kind)) setTimeout(()=>f.focus({preventScroll:true}),260); });
  } else {
    // keep typed values while re-rendering
    const vals = {}; root.querySelectorAll('input,textarea,select').forEach(el => { if (el.id) vals[el.id] = el.value; });
    const act = document.activeElement && document.activeElement.id;
    document.getElementById('sheetBody').innerHTML = html;
    Object.entries(vals).forEach(([id,v]) => { const el = document.getElementById(id); if (el && el.closest('#sheetRoot')) el.value = v; });
    if (act){ const el = document.getElementById(act); if (el) el.focus({preventScroll:true}); }
  }
}
function closeSheet(){
  sheet = null; formDays = null; formArea = null; confirmKey = null;
  const root = document.getElementById('sheetRoot');
  const s = root.querySelector('.sheet'), sc = root.querySelector('.scrim');
  if (s){ s.classList.remove('show'); sc.classList.remove('show'); setTimeout(() => { if (!sheet) root.innerHTML = ''; }, 260); }
  return '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet){ closeSheet(); render(); } });

/* toast */
let toastT;
function toast(msg, undo){
  const r = document.getElementById('toastRoot');
  r.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo?'<button id="undoBtn">Geri al</button>':''}</div>`;
  if (undo) document.getElementById('undoBtn').onclick = () => { undo(); r.innerHTML = ''; };
  clearTimeout(toastT); toastT = setTimeout(() => r.innerHTML = '', 4000);
}

/* ---------- actions ---------- */
const A = {
  tab: id => setTab(id),
  quick: id => { qType = id || (tab==='not' ? noteSeg : 'rem'); openSheet('quick'); },
  qType: id => { qType = id; renderSheet(); },
  remKind: id => { remKind = id; renderSheet(); },
  settings: () => openSheet('settings'),
  close: () => { closeSheet(); render(); },
  dismissStarter: () => { S.meta.starter = false; touch('meta'); },
  routine: id => { const k = tk(); const l = S.routines.log[k] = S.routines.log[k] || {}; l[id] = !l[id]; pruneRoutineLog(); touch('routines'); },
  editRoutine: id => openSheet('routine', id),
  hToggle: (id, k) => { const h = S.habits.find(x=>x.id===id); if (!h) return; h.log = h.log||{}; if (h.log[k]) delete h.log[k]; else h.log[k] = 1; touch('habits'); },
  habit: id => openSheet('habit', id),
  habitForm: id => { formDays = null; formArea = null; openSheet('habitForm', id); },
  fDay: id => { const d = +id; formDays = formDays.includes(d) ? formDays.filter(x=>x!==d) : [...formDays, d]; renderSheet(); },
  fArea: id => { formArea = id; renderSheet(); },
  hFilter: id => { habitFilter = id; render(); },
  gFilter: id => { goalFilter = id; render(); },
  arm: (id, k) => { confirmKey = k + id; renderSheet(); },
  habitDel: id => { const i = S.habits.findIndex(x=>x.id===id); const h = S.habits.splice(i,1)[0]; closeSheet(); touch('habits'); toast('Alışkanlık silindi', () => { S.habits.splice(i,0,h); touch('habits'); }); },
  goal: id => openSheet('goal', id),
  goalForm: id => { formArea = null; openSheet('goalForm', id); },
  goalDel: id => { const i = S.goals.findIndex(x=>x.id===id); const g = S.goals.splice(i,1)[0]; closeSheet(); touch('goals'); toast('Hedef silindi', () => { S.goals.splice(i,0,g); touch('goals'); }); },
  msToggle: (id, k) => { const g = S.goals.find(x=>x.id===id); const m = g.milestones.find(x=>x.id===k); m.done = !m.done; touch('goals'); },
  msDel: (id, k) => { const g = S.goals.find(x=>x.id===id); g.milestones = g.milestones.filter(x=>x.id!==k); touch('goals'); },
  aiSteps: id => { const g = S.goals.find(x=>x.id===id); ask('g'+id, async () => { const r = await sample.json(stepsPrompt(g), {modelTier:'default'}); const steps = (r && r.steps || []).filter(s => typeof s === 'string').slice(0,6); steps.forEach(s => g.milestones.push({id:uid(), text:s, done:false})); touch('goals'); toast(`${steps.length} adım eklendi. İstemediklerini silebilirsin.`); }); },
  remDone: id => { const r = S.reminders.find(x=>x.id===id); r.done = true; r.doneAt = Date.now(); pruneReminders(); touch('reminders'); toast('Tamamlandı', () => { r.done = false; touch('reminders'); }); },
  remDel: id => { const i = S.reminders.findIndex(x=>x.id===id); const r = S.reminders.splice(i,1)[0]; touch('reminders'); toast('Hatırlatma silindi', () => { S.reminders.splice(i,0,r); touch('reminders'); }); },
  lesson: () => ask('lesson', async () => { const r = await sample.json(lessonPrompt(), {modelTier:'default'}); if (!r || !Array.isArray(r.words)) throw {code:'bad'}; S.english.lessons[tk()] = {topic:String(r.topic||''), words:r.words.slice(0,6).map(w=>({en:String(w.en||''),tr:String(w.tr||''),example:String(w.example||'')})), pattern:r.pattern?{title:String(r.pattern.title||''),en:String(r.pattern.en||''),tr:String(r.pattern.tr||'')}:null, task:String(r.task||''), done:false}; pruneLessons(); touch('english'); }),
  lessonDone: k => { const l = S.english.lessons[k]; l.done = !l.done; const h = S.habits.find(x => x.area === 'ingilizce' && isSched(x, today())); if (h){ h.log = h.log||{}; if (l.done) h.log[k] = 1; else delete h.log[k]; touch('english','habits'); } else touch('english'); if (l.done) toast('Harika! İngilizce alışkanlığın da işaretlendi.'); },
  water: d => { const k = tk(); S.health.water[k] = Math.max(0, (S.health.water[k]||0) + (+d)); pruneHealth(); touch('health'); },
  mealDel: id => { S.health.meals = S.health.meals.filter(x=>x.id!==id); touch('health'); },
  woDel: id => { S.health.workouts = S.health.workouts.filter(x=>x.id!==id); touch('health'); },
  coach: () => ask('coach', async () => { const r = await sample(coachPrompt(), {modelTier:'default'}); S.health.comments.push({date:tk(), text:String(r.text||'').trim()}); S.health.comments = S.health.comments.slice(-10); touch('health'); }),
  nSeg: id => { noteSeg = id; render(); },
  nToggle: id => { const n = S.notes.find(x=>x.id===id); n.done = !n.done; touch('notes'); },
  nPin: id => { const n = S.notes.find(x=>x.id===id); n.pinned = !n.pinned; touch('notes'); },
  nDel: id => { const i = S.notes.findIndex(x=>x.id===id); const n = S.notes.splice(i,1)[0]; touch('notes'); toast('Silindi', () => { S.notes.splice(i,0,n); touch('notes'); }); },
  nClear: () => { const before = S.notes; S.notes = S.notes.filter(n => !(n.list===noteSeg && n.done)); touch('notes'); toast('Tamamlananlar temizlendi', () => { S.notes = before; touch('notes'); }); }
};
function pruneRoutineLog(){ const cut = keyOf(addDays(today(),-120)); Object.keys(S.routines.log).forEach(k => { if (k < cut) delete S.routines.log[k]; }); }
function pruneReminders(){ const done = S.reminders.filter(r=>r.done).sort((a,b)=>b.doneAt-a.doneAt); if (done.length > 60){ const drop = new Set(done.slice(60).map(r=>r.id)); S.reminders = S.reminders.filter(r=>!drop.has(r.id)); } }
function pruneLessons(){ const ks = Object.keys(S.english.lessons).sort(); ks.slice(0, Math.max(0, ks.length-60)).forEach(k => delete S.english.lessons[k]); }
function pruneHealth(){ const cut = keyOf(addDays(today(),-400)); const H = S.health; H.meals = H.meals.filter(m=>m.date>=cut); H.workouts = H.workouts.filter(m=>m.date>=cut); Object.keys(H.water).forEach(k => { if (k < cut) delete H.water[k]; }); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault();
  fn(el.dataset.id, el.dataset.k);
});

const F = {
  quicknote: () => { const v = $('#qn').value.trim(); if (!v) return; S.notes.push({id:uid(), list:'not', text:v, created:Date.now(), pinned:false, done:false}); $('#qn').value=''; touch('notes'); toast('Not kaydedildi'); },
  note: () => { const el = $('#nText'); const v = el.value.trim(); if (!v) return; S.notes.push({id:uid(), list:noteSeg, text:v, created:Date.now(), pinned:false, done:false}); el.value=''; touch('notes'); },
  quick: () => {
    const v = $('#qText').value.trim(); if (!v) return;
    if (qType === 'rem'){
      const r = {id:uid(), text:v, kind:remKind, created:Date.now(), done:false, time:''};
      if (remKind === 'week') r.date = keyOf(endOfWeek(today()));
      if (remKind === 'date'){ r.date = $('#rDate').value || keyOf(addDays(today(),1)); r.time = $('#rTime').value || ''; }
      S.reminders.push(r); touch('reminders'); toast('Hatırlatma eklendi; yapana kadar Bugün sayfasında.');
    } else { S.notes.push({id:uid(), list:qType, text:v, created:Date.now(), pinned:false, done:false}); touch('notes'); toast('Eklendi'); }
    closeSheet(); render();
  },
  habit: form => {
    const name = $('#hName').value.trim(); if (!name) return;
    if (!formDays.length){ toast('En az bir gün seç.'); return; }
    const id = form.dataset.id; const data = {name, area:formArea, days:[...formDays].sort(), time:$('#hTime').value, note:$('#hNote').value.trim()};
    if (id) Object.assign(S.habits.find(x=>x.id===id), data); else S.habits.push({id:uid(), created:tk(), log:{}, ...data});
    touch('habits'); closeSheet(); render(); if (id) openSheet('habit', id);
  },
  goal: form => {
    const title = $('#gTitle').value.trim(); if (!title) return;
    const id = form.dataset.id; const data = {title, area:formArea, why:$('#gWhy').value.trim(), deadline:$('#gDl').value};
    let gid = id;
    if (id) Object.assign(S.goals.find(x=>x.id===id), data); else { gid = uid(); S.goals.push({id:gid, created:tk(), milestones:[], ...data}); }
    touch('goals'); closeSheet(); render(); openSheet('goal', gid);
  },
  milestone: form => { const el = $('#msText'); const v = el.value.trim(); if (!v) return; S.goals.find(x=>x.id===form.dataset.id).milestones.push({id:uid(), text:v, done:false}); el.value = ''; touch('goals'); },
  routine: form => {
    const which = form.dataset.id, old = S.routines[which];
    const lines = $('#rList').value.split('\n').map(s=>s.trim()).filter(Boolean);
    S.routines[which] = lines.map(t => { const o = old.find(i=>i.text===t); return {id:o?o.id:uid(), text:t}; });
    touch('routines'); closeSheet(); render();
  },
  meal: () => { const v = $('#mText').value.trim(); if (!v) return; S.health.meals.push({id:uid(), date:tk(), kind:$('#mKind').value, text:v}); pruneHealth(); touch('health'); },
  workout: () => { const v = $('#wText').value.trim(); if (!v) return; S.health.workouts.push({id:uid(), date:tk(), text:v, minutes:Math.max(0, parseInt($('#wMin').value,10)||0)}); touch('health'); },
  weight: () => { const kg = parseFloat(String($('#kg').value).replace(',','.')); if (!(kg > 20 && kg < 400)) { toast('Geçerli bir kilo gir.'); return; } const k = tk(); S.health.weights = S.health.weights.filter(w=>w.date!==k); S.health.weights.push({date:k, kg:Math.round(kg*10)/10}); S.health.weights.sort((a,b)=>a.date.localeCompare(b.date)); S.health.weights = S.health.weights.slice(-200); touch('health'); },
  settings: () => { S.meta.name = $('#sName').value.trim() || 'Bahar'; S.meta.level = $('#sLevel').value; S.meta.waterGoal = Math.min(20, Math.max(1, parseInt($('#sWater').value,10)||8)); const kg = parseFloat($('#sKg').value); S.meta.targetKg = kg > 20 ? Math.round(kg*10)/10 : null; touch('meta'); closeSheet(); render(); toast('Ayarlar kaydedildi'); }
};
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault(); const fn = F[f.dataset.form]; if (fn) fn(f);
});
// Enter in the note textarea adds, Shift+Enter makes a new line
document.addEventListener('keydown', e => { if (e.target.id === 'nText' && e.target.tagName === 'TEXTAREA' && e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); F.note(); } });

// re-render at midnight / when returning to the app so "today" stays right
let lastDay = tk();
document.addEventListener('visibilitychange', () => { if (!document.hidden && tk() !== lastDay){ lastDay = tk(); render(); } });
setInterval(() => { if (tk() !== lastDay){ lastDay = tk(); render(); } }, 60000);

boot();
})();
</script>
